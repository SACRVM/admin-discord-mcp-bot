name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: dotnet publish
        shell: pwsh
        run: dotnet publish AdminDiscordMcp.csproj -c Release -o bin\win-x64

      - name: Boot smoke (server must answer /healthz)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "bin\win-x64\admin-discord-mcp.exe" -PassThru
          $ok = $false
          foreach ($i in 1..20) {
            Start-Sleep -Milliseconds 500
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:47823/healthz" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          $proc | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Server did not answer /healthz within 10s." }
          Write-Host "Boot smoke OK."
